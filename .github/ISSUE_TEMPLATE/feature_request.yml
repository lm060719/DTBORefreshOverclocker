name: 功能建议 / Feature request
description: 新功能或改进建议。Suggest a new feature or improvement.
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 建议内容 / Proposal
      description: 想解决什么问题，希望怎么实现。What problem it solves and how you imagine it.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 机型（可选）/ Device (optional)
