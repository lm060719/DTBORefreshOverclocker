name: DTBO Studio build

on:
  push:
    branches:
      - "main"
      - "chatgpt"
      - "chatgpt/**"
  pull_request:
    branches:
      - "main"
      - "chatgpt"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Package source
        run: |
          zip -r DTBOStudio_Source.zip . \
            -x ".git/*" ".gradle/*" "build/*" "*/build/*" "DTBOStudio_Source.zip"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: DTBOStudio_Source
          path: DTBOStudio_Source.zip
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DTBOStudio_Debug_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # 只有推送到 main（或在 main 上手动触发）才打正式包；PR 拿不到签名 Secrets。
  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::未配置 SIGNING_KEYSTORE_BASE64 等签名 Secrets"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble release
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Verify signature and rename
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::没有生成已签名的 app-release.apk"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp "$apk" "dist/DTBOStudio_v${version}_${GITHUB_SHA::7}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DTBOStudio_Release_APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
