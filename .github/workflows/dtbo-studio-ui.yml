name: DTBO Studio UI validation

on:
  push:
    branches:
      - "chatgpt"
      - "chatgpt/**"
  pull_request:
    branches:
      - "chatgpt"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Package source
        run: |
          zip -r DTBOStudio_Source.zip . \
            -x ".git/*" ".gradle/*" "build/*" "*/build/*" "DTBOStudio_Source.zip"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: DTBOStudio_Source
          path: DTBOStudio_Source.zip
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DTBOStudio_Debug_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
