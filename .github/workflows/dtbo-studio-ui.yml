name: DTBO Studio UI validation

on:
  push:
    branches:
      - chatgpt/dtbo-studio-ui

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Package source
        run: |
          zip -r DTBOStudio_Source.zip . \
            -x ".git/*" ".gradle/*" "build/*" "app/build/*" "app/release/*" "DTBOStudio_Source.zip"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: DTBOStudio_Source
          path: DTBOStudio_Source.zip
          if-no-files-found: error
